server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # SPA fallback: cualquier ruta no encontrada sirve index.html
    # para que react-router maneje el routing del lado del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache largo para assets versionados por Vite (tienen hash en el nombre)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Sin cache para index.html (siempre obtener la version mas reciente)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
